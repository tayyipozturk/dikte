[project]
name = "dikte"
version = "0.1.0"
description = "Lightweight macOS menu-bar dictation (Turkish + English) that inserts text where your cursor is."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
]

# On Linux the GTK bindings normally come from the system (apt install python3-gi
# gir1.2-ayatanaappindicator3-0.1) and the venv is created with
# --system-site-packages; scripts/install-ubuntu.sh does this for you.
[project.optional-dependencies]
gtk = ["pygobject>=3.48; sys_platform == 'linux'"]

[project.scripts]
dikte = "dikte.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dikte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs whisper-server, a downloaded model and the macOS `say` command"]
addopts = "-m 'not integration'"
